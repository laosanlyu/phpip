services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: phpip-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-phpip_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_123}
      MYSQL_USER: ${DB_USERNAME:-phpip}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_password_123}
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "${DB_PORT:-3307}:3306"  # Different port to avoid conflicts
    networks:
      - phpip-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Application (Development mode with Xdebug)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development  # Use development stage
    container_name: phpip-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - CONTAINER_ROLE=app
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - phpip-dev-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: phpip-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - phpip-dev-network

  # Redis (optional - for testing caching)
  redis:
    image: redis:alpine
    container_name: phpip-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"  # Different port
    volumes:
      - redis_dev_data:/data
    networks:
      - phpip-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vite Dev Server (for hot module replacement during development)
  vite:
    image: node:20-alpine
    container_name: phpip-vite-dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - phpip-dev-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

networks:
  phpip-dev-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
