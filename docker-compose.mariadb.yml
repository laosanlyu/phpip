# EXPERIMENTAL: MariaDB configuration for future migration
# NOTE: The current database schema (database/schema/mysql-schema.sql) was created for MySQL 8.0
# and has compatibility issues with MariaDB. To use MariaDB:
# 1. Create .env with DB_HOST=mariadb and DB_COLLATION=utf8mb4_unicode_ci
# 2. The schema file needs to be converted for MariaDB compatibility
# For production, use docker-compose.prod.yml with MySQL 8.0

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.2
    container_name: phpip-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-phpip}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MARIADB_USER: ${DB_USERNAME:-phpip}
      MARIADB_PASSWORD: ${DB_PASSWORD:-phpip_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - phpip-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: phpip-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-production}
      - CONTAINER_ROLE=app
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - phpip-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: phpip-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - phpip-network

  # Laravel Scheduler (for cron jobs like renewal reminders)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: phpip-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-production}
      - CONTAINER_ROLE=scheduler
    depends_on:
      - mariadb
      - app
    networks:
      - phpip-network
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

  # Redis (optional - for caching and queues)
  redis:
    image: redis:alpine
    container_name: phpip-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - phpip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  phpip-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
